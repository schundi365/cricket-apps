<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HMS Suite Lab API Test Form</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --panel: #ffffff;
      --ink: #13233a;
      --muted: #5f7187;
      --accent: #0b6fa4;
      --accent-2: #14a38b;
      --border: #d7e0ea;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, #dff2ff 0%, transparent 35%),
        radial-gradient(circle at 90% 20%, #d8fff5 0%, transparent 30%),
        var(--bg);
      min-height: 100vh;
      padding: 24px;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 12px 24px rgba(15, 39, 73, 0.08);
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    p { color: var(--muted); }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
      align-items: center;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      color: white;
      cursor: pointer;
    }

    .btn-sample { background: var(--accent); }
    .btn-submit { background: var(--accent-2); }
    .btn-patient { background: #0e8c61; }
    .btn-mismatch { background: #b66b00; }

    select {
      min-width: 300px;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 10px;
      font-size: 14px;
      color: var(--ink);
      background: #fff;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 12px;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 13px;
      resize: vertical;
    }

    .mini-input {
      min-height: 90px;
      margin-top: 10px;
      font-size: 13px;
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1b2f;
      color: #dbf0ff;
      padding: 12px;
      min-height: 160px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 13px;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #eef4fb;
      color: var(--ink);
    }

    tr.row-contradiction td {
      background: #ffe6e6;
      border-color: #e7a5a5;
    }

    tr.row-missing td {
      background: #fff3df;
      border-color: #e6c08d;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <h1>HMS Suite Realtime Lab API Test Form</h1>
      <p>Load sample payload from Hugging Face and run diagnostic suggestions.</p>
    </section>

    <section class="card">
      <div class="row">
        <button class="btn-patient" id="loadPatients">Load Patients From HMS SQL</button>
        <select id="patientSelect">
          <option value="">Select a patient...</option>
        </select>
        <button class="btn-patient" id="processPatient">Process Selected Patient</button>
      </div>
      <div class="controls">
        <button class="btn-sample" id="loadSample">Load Hugging Face Sample</button>
        <button class="btn-submit" id="runAnalysis">Run Analysis</button>
        <button class="btn-mismatch" id="runMismatch">Run Mismatch Triage</button>
      </div>
      <label for="radiologyImpression"><strong>Radiology Impression (CT/MRI/X-ray narrative)</strong></label>
      <textarea id="radiologyImpression" class="mini-input" placeholder="Paste impression text, e.g. CT brain: acute infarct in MCA territory..."></textarea>
      <label for="llmQuestions"><strong>Patient LLM Questions (ChatGPT/Groq etc.)</strong></label>
      <textarea id="llmQuestions" class="mini-input" placeholder="One concern/question per line, e.g. Is this cancer? Is this life threatening?"></textarea>
      <label for="llmNarrative"><strong>External LLM Narrative Output (optional)</strong></label>
      <textarea id="llmNarrative" class="mini-input" placeholder="Paste ChatGPT/Groq full interpretation text here for claim extraction and reconciliation."></textarea>
      <textarea id="payload" spellcheck="false"></textarea>
    </section>

    <section class="card">
      <h3>API Response</h3>
      <pre id="result">Run a sample to view output...</pre>
    </section>

    <section class="card hidden" id="mismatchCard">
      <h3>Doctor Mismatch Triage</h3>
      <div id="mismatchSummary"></div>
      <table>
        <thead>
          <tr>
            <th>Status</th>
            <th>Source</th>
            <th>Entity</th>
            <th>Claim</th>
            <th>Reason</th>
            <th>Follow-up</th>
          </tr>
        </thead>
        <tbody id="mismatchRows"></tbody>
      </table>
    </section>
  </div>

  <script>
    const payloadEl = document.getElementById("payload");
    const resultEl = document.getElementById("result");
    const patientSelect = document.getElementById("patientSelect");
    const mismatchCard = document.getElementById("mismatchCard");
    const mismatchSummary = document.getElementById("mismatchSummary");
    const mismatchRows = document.getElementById("mismatchRows");
    const radiologyEl = document.getElementById("radiologyImpression");
    const llmQuestionsEl = document.getElementById("llmQuestions");
    const llmNarrativeEl = document.getElementById("llmNarrative");

    function renderMismatchTable(data) {
      mismatchRows.innerHTML = "";

      const count = Number(data.mismatch_count || 0);
      mismatchSummary.textContent = `Urgency: ${data.urgency || "N/A"} | Mismatches: ${count}`;

      if (!Array.isArray(data.items) || data.items.length === 0) {
        const row = document.createElement("tr");
        row.innerHTML = "<td colspan=\"6\">No contradiction or missing HMS mismatches detected.</td>";
        mismatchRows.appendChild(row);
      } else {
        for (const item of data.items) {
          const row = document.createElement("tr");
          if ((item.status || "") === "contradiction") {
            row.classList.add("row-contradiction");
          } else if ((item.status || "") === "missing_in_hms") {
            row.classList.add("row-missing");
          }
          row.innerHTML = `
            <td>${item.status || ""}</td>
            <td>${item.source || ""}</td>
            <td>${item.category || ""}/${item.entity || ""}</td>
            <td>${item.claim_text || ""}</td>
            <td>${item.reason || ""}</td>
            <td>${item.recommended_followup || ""}</td>
          `;
          mismatchRows.appendChild(row);
        }
      }

      mismatchCard.classList.remove("hidden");
    }

    function attachNarrativeInputs(payload) {
      if (!payload || typeof payload !== "object") {
        return payload;
      }

      const impression = (radiologyEl.value || "").trim();
      const llmQuestions = (llmQuestionsEl.value || "")
        .split("\n")
        .map(q => q.trim())
        .filter(Boolean);

      payload.radiology_reports = payload.radiology_reports || [];
      payload.patient_llm_questions = payload.patient_llm_questions || [];

      if (impression) {
        payload.radiology_reports = [
          {
            modality: null,
            body_part: null,
            impression_text: impression,
            findings_text: null,
            source: "doctor-input"
          }
        ];
      }

      if (llmQuestions.length > 0) {
        payload.patient_llm_questions = llmQuestions;
      }

      const narrative = (llmNarrativeEl.value || "").trim();
      if (narrative) {
        payload.external_llm_output_text = narrative;
      }

      return payload;
    }

    function patientLabel(p) {
      const name = p.name || "Unknown";
      const sex = p.sex || "U";
      const meds = Number.isFinite(p.medication_count) ? p.medication_count : 0;
      return `${p.patient_id} | ${name} | ${sex} | meds:${meds}`;
    }

    async function loadPatients() {
      resultEl.textContent = "Loading patients from /api/v1/patients...";
      try {
        const resp = await fetch("/api/v1/patients?limit=50");
        const data = await resp.json();
        patientSelect.innerHTML = '<option value="">Select a patient...</option>';

        if (!Array.isArray(data.items) || data.items.length === 0) {
          resultEl.textContent = JSON.stringify(data, null, 2);
          return;
        }

        for (const item of data.items) {
          const opt = document.createElement("option");
          opt.value = item.patient_id;
          opt.textContent = patientLabel(item);
          patientSelect.appendChild(opt);
        }
        resultEl.textContent = `Loaded ${data.items.length} patients.`;
      } catch (err) {
        resultEl.textContent = `Failed to load patients: ${err}`;
      }
    }

    async function processPatient() {
      const patientId = patientSelect.value;
      if (!patientId) {
        resultEl.textContent = "Select a patient before processing.";
        return;
      }
      resultEl.textContent = `Processing patient ${patientId}...`;
      try {
        const resp = await fetch(`/api/v1/patients/${encodeURIComponent(patientId)}/process`, {
          method: "POST",
          headers: { "Content-Type": "application/json" }
        });
        const data = await resp.json();
        resultEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultEl.textContent = `Patient processing failed: ${err}`;
      }
    }

    async function loadSample() {
      resultEl.textContent = "Loading sample from /api/v1/samples/hf...";
      try {
        const resp = await fetch("/api/v1/samples/hf?limit=1");
        const data = await resp.json();
        payloadEl.value = JSON.stringify(data.items[0], null, 2);
        resultEl.textContent = "Sample loaded. Click Run Analysis.";
      } catch (err) {
        resultEl.textContent = `Failed to load sample: ${err}`;
      }
    }

    async function runAnalysis() {
      resultEl.textContent = "Sending request...";
      try {
        const payload = attachNarrativeInputs(JSON.parse(payloadEl.value));
        const resp = await fetch("/api/v1/diagnose/labs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await resp.json();
        resultEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultEl.textContent = `Request failed: ${err}`;
      }
    }

    async function runMismatch() {
      resultEl.textContent = "Running mismatch triage...";
      try {
        const payload = attachNarrativeInputs(JSON.parse(payloadEl.value));
        const resp = await fetch("/api/v1/diagnose/mismatches", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await resp.json();
        resultEl.textContent = JSON.stringify(data, null, 2);
        renderMismatchTable(data);
      } catch (err) {
        resultEl.textContent = `Mismatch request failed: ${err}`;
      }
    }

    document.getElementById("loadSample").addEventListener("click", loadSample);
    document.getElementById("runAnalysis").addEventListener("click", runAnalysis);
    document.getElementById("runMismatch").addEventListener("click", runMismatch);
    document.getElementById("loadPatients").addEventListener("click", loadPatients);
    document.getElementById("processPatient").addEventListener("click", processPatient);
  </script>
</body>
</html>
